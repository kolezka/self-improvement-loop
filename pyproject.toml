[project]
name = "sil"
version = "0.1.0"
description = "Self-improvement loop for Claude Code: background reflection, artifact promotion, usage feedback"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
sil = "sil.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sil"]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
# Must stay true: `package = false` makes uv skip installing the project, so
# `uv run sil` would run the sil/ directory as a script and crash on imports.
package = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
